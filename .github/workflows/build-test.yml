name: Build Test (everything runs)

on:
  push:
    branches: [ "1.20.1", "1.21.1-neo", "1.21.1-fabric", "1.21.11-neo", "1.21.11-fabric", "26.1.x-neo", "26.1.x-fabric", "26.2.x-neo", "26.2.x-fabric" ]
  pull_request:
    branches: [ "1.20.1", "1.21.1-neo", "1.21.1-fabric", "1.21.11-neo", "1.21.11-fabric", "26.1.x-neo", "26.1.x-fabric", "26.2.x-neo", "26.2.x-fabric" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ForgeGradle 7 requires Gradle 9.3.0+. Keep the Java 17 toolchain.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Build with Gradle
        run: |
          gradle --version
          gradle clean build --console=plain

      - name: Verify production Mixin fields
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess
          jars = [p for p in pathlib.Path('build/libs').glob('*.jar')
                  if not p.name.endswith(('-dev.jar', '-dev-renamed.jar', '-sources.jar'))]
          assert len(jars) == 1, f'Expected one production jar, found: {jars}'
          result = subprocess.run([
              'javap', '-private', '-classpath', str(jars[0]),
              'me.srrapero720.chloride.mixins.impl.OverlayMixin'
          ], check=True, text=True, capture_output=True)
          print(result.stdout)
          for field in ('fps', 'options', 'metricsRecorder', 'level', 'gpuUtilization'):
              assert not any(line.strip().endswith(' ' + field + ';')
                             for line in result.stdout.splitlines()), f'Unmapped Shadow field: {field}'
          PYTHON

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-dev-renamed.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
